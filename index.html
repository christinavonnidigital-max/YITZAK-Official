          <div>
            <h3>Capability Building</h3>
            <ul>
              <li><strong>Professional Training:</strong> Practical, instructor-led training across management systems and industry disciplines: Yitzak programmes, FoodChain ID courses, corporate &amp; in-house delivery, and customised workforce learning.</li>
              <li><strong>Certification Preparation:</strong> Preparation across international standards (BRCGS, FSSC 22000, ISO, GLOBALG.A.P., and Non-GMO) through our FoodChain ID partnership. Formal certification is conducted and issued by the relevant accredited certification body.</li>

              <li><strong>Business Process Implementation:</strong> Process mapping, SOP formulation, governance controls, workflow rollout, and team handover to drive operational excellence.</li>
            </ul>
          </div>
        </section>
        <section>

          <ul>
            <li><strong>Food Safety:</strong> HACCP, FSSC 22000, BRCGS, Food Defence, Food Fraud, GMP, PCQI, Food Safety Culture.</li>
            <li><strong>Quality Management:</strong> ISO 9001, Internal Auditing, Lead Auditor, CAPA, Supplier Auditing, Documentation Control.</li>
            <li><strong>Environmental Management:</strong> ISO 14001, EMS, Climate Change Integration, Environmental Compliance.</li>
            <li><strong>Occupational Health &amp; Safety:</strong> ISO 45001, Hazard ID &amp; Risk Assessment, Emergency Preparedness, Workplace Safety.</li>

          </ul>
